[project]
name = "abuse-ring-sentinel"
version = "0.1.0"
description = "AI-powered coordinated abuse and fraud-ring detection system for Razorpay AI Buildathon Track 02"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=2.0,<3.0",
    "faker>=37.0,<38.0",
    "networkx>=3.4,<4.0",
    "scikit-learn>=1.6,<2.0",
    "xgboost>=3.0,<4.0",
    "matplotlib>=3.10,<4.0",
    "seaborn>=0.13,<1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.packages.find]
include = [
    "api*",
    "audit*",
    "data*",
    "features*",
    "graph*",
    "investigation*",
    "models*",
    "policy*",
]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"